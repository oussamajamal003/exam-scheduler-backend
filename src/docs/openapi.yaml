openapi: 3.0.0
info:
  title: Smart Exam Scheduling System API
  version: 1.0.0
  description: Comprehensive API documentation for the Smart Exam Scheduling System.
servers:
  - url: /api
    description: Main API server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, PROCTOR, STUDENT]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        createdAt:
          type: string
          format: date-time
    DepartmentCreate:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          example: Computer Science
        code:
          type: string
          example: CS
    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
          example: Computer Science
        code:
          type: string
          example: CS
    Program:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        description:
          type: string
          nullable: true
        departmentId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProgramCreate:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          example: Bachelor of Science in Computer Science
        code:
          type: string
          example: BSCS
        description:
          type: string
          example: Four year program in Computer Science
        departmentId:
          type: string
          format: uuid
        isActive:
          type: boolean
          default: true
    ProgramUpdate:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: string
        departmentId:
          type: string
          format: uuid
        isActive:
          type: boolean
    Semester:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isActive:
          type: boolean
        isCurrent:
          type: boolean
        academicYear:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, UPCOMING, PAST]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SemesterCreate:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
          example: Fall 2026
        startDate:
          type: string
          format: date-time
          example: '2026-09-01T00:00:00Z'
        endDate:
          type: string
          format: date-time
          example: '2026-12-31T23:59:59Z'
        isActive:
          type: boolean
          default: false
        isCurrent:
          type: boolean
          default: false
        academicYear:
          type: string
          example: '2026'
        status:
          type: string
          enum: [ACTIVE, UPCOMING, PAST]
          default: UPCOMING
    SemesterUpdate:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isActive:
          type: boolean
        isCurrent:
          type: boolean
        academicYear:
          type: string
        status:
          type: string
          enum: [ACTIVE, UPCOMING, PAST]
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        programId:
          type: string
          format: uuid
          nullable: true
        credits:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseCreate:
      type: object
      required: [code, title]
      properties:
        code:
          type: string
          example: CS101
        title:
          type: string
          example: Introduction to Computer Science
        programId:
          type: string
          format: uuid
        credits:
          type: integer
          example: 3
        description:
          type: string
          example: Fundamental concepts of computer science
        isActive:
          type: boolean
          default: true
    CourseUpdate:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        programId:
          type: string
          format: uuid
        credits:
          type: integer
        description:
          type: string
        isActive:
          type: boolean
    CourseOffering:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        section:
          type: string
          nullable: true
        instructor:
          type: string
          nullable: true
        expectedStudents:
          type: integer
        capacity:
          type: integer
          nullable: true
        day:
          type: string
          nullable: true
        time:
          type: string
          nullable: true
        roomLabel:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, CANCELLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseOfferingCreate:
      type: object
      required: [courseId, semesterId]
      properties:
        courseId:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        semesterId:
          type: string
          format: uuid
          example: '223e4567-e89b-12d3-a456-426614174001'
        section:
          type: string
          example: A
        instructor:
          type: string
          example: Dr. John Smith
        expectedStudents:
          type: integer
          example: 30
        capacity:
          type: integer
          example: 35
        day:
          type: string
          example: Monday
        time:
          type: string
          example: '09:00-10:30'
        roomLabel:
          type: string
          example: Room 101
        notes:
          type: string
          example: Lab session included
        status:
          type: string
          enum: [ACTIVE, INACTIVE, CANCELLED]
          default: ACTIVE
    CourseOfferingUpdate:
      type: object
      properties:
        courseId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        section:
          type: string
        instructor:
          type: string
        expectedStudents:
          type: integer
        capacity:
          type: integer
        day:
          type: string
        time:
          type: string
        roomLabel:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, CANCELLED]
    TimeSlot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        date:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TimeSlotCreate:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          type: string
          format: date-time
          example: '2026-09-15T09:00:00Z'
        endTime:
          type: string
          format: date-time
          example: '2026-09-15T10:30:00Z'
        date:
          type: string
          format: date-time
        duration:
          type: integer
          example: 90
    TimeSlotUpdate:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        date:
          type: string
          format: date-time
        duration:
          type: integer
    Registration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        courseOfferingId:
          type: string
          format: uuid
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RegistrationCreate:
      type: object
      required: [studentId, courseOfferingId]
      properties:
        studentId:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174005'
        courseOfferingId:
          type: string
          format: uuid
          example: '223e4567-e89b-12d3-a456-426614174006'
        status:
          type: string
          default: ACTIVE
    RegistrationUpdate:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
        courseOfferingId:
          type: string
          format: uuid
        status:
          type: string
    RegistrationBulkImport:
      type: object
      required: [enrollments]
      properties:
        enrollments:
          type: array
          items:
            type: object
            required: [studentId, courseOfferingId]
            properties:
              studentId:
                type: string
                format: uuid
              courseOfferingId:
                type: string
                format: uuid
              status:
                type: string
                default: ACTIVE
    Center:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CenterCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Main Campus
        location:
          type: string
          example: Downtown
        code:
          type: string
          example: MC
        description:
          type: string
          example: Primary examination center
        isActive:
          type: boolean
          default: true
    CenterUpdate:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        code:
          type: string
        description:
          type: string
        isActive:
          type: boolean
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
        status:
          type: string
          enum: [AVAILABLE, MAINTENANCE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoomCreate:
      type: object
      required: [centerId, name, capacity]
      properties:
        centerId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174002
        name:
          type: string
          example: A-101
        capacity:
          type: integer
          example: 50
        status:
          type: string
          enum: [AVAILABLE, MAINTENANCE]
          default: AVAILABLE
    RoomUpdate:
      type: object
      properties:
        name:
          type: string
        capacity:
          type: integer
        status:
          type: string
          enum: [AVAILABLE, MAINTENANCE]
tags:
  - name: AI
    description: Schedule evaluation and AI utilities.
  - name: Auth
    description: Authentication and user account management.
  - name: Courses
    description: Course management.
  - name: Departments
    description: Department management.
  - name: Programs
    description: Program management.
  - name: Semesters
    description: Semester lifecycle.
  - name: Course Offerings
    description: Semester-specific course offerings.
  - name: Enrollments
    description: Student enrollments and import operations.
  - name: Exams
    description: Exam management.
  - name: Centers
    description: Centers and room inventories.
  - name: Rooms
    description: Room availability and administration.
  - name: Scheduling
    description: Schedule generation and analysis.
  - name: Students
    description: Student management.
  - name: Proctors
    description: Proctor management.
  - name: Time Slots
    description: Timeslot availability and management.
security:
  - bearerAuth: []
paths:
  /auth:
    get:
      tags: [Auth]
      summary: Get all users
      responses:
        '200':
          description: Users fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Auth]
      summary: Delete current user
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: john.doe@example.com
              password: securepassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /courses:
    get:
      tags: [Courses]
      summary: Get all courses
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
          description: Items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by code or title
        - in: query
          name: programId
          schema:
            type: string
            format: uuid
          description: Filter by program ID
      responses:
        '200':
          description: Courses list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Courses]
      summary: Create a course
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
            example:
              code: CS101
              title: Introduction to Computer Science
              programId: 123e4567-e89b-12d3-a456-426614174003
              credits: 3
              description: Fundamental concepts of computer science
              isActive: true
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /courses/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Course ID
    get:
      tags: [Courses]
      summary: Get course by ID
      responses:
        '200':
          description: Course fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Courses]
      summary: Update a course
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
            example:
              title: Introduction to Computer Science (Updated)
              credits: 4
              isActive: true
      responses:
        '200':
          description: Course updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Courses]
      summary: Delete a course
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Course deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /departments:
    get:
      tags: [Departments]
      summary: Get all departments
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
          description: Items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by name or code
      responses:
        '200':
          description: Departments list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Departments]
      summary: Create a department
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
            example:
              name: Computer Science
              code: CS
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /departments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Departments]
      summary: Get department by ID
      responses:
        '200':
          description: Department details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Department not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Departments]
      summary: Update department
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Department not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Departments]
      summary: Delete department
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Department deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Department not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /programs:
    get:
      tags: [Programs]
      summary: Get all programs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
          description: Items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by name or code
      responses:
        '200':
          description: Programs list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Programs]
      summary: Create a program
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
            example:
              name: Bachelor of Science in Computer Science
              code: BSCS
              description: Four year program in Computer Science
              departmentId: 123e4567-e89b-12d3-a456-426614174003
              isActive: true
      responses:
        '201':
          description: Program created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /programs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Program ID
    get:
      tags: [Programs]
      summary: Get program by ID
      responses:
        '200':
          description: Program fetched successfully
          content:
