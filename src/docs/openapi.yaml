openapi: 3.0.0
info:
  title: Smart Exam Scheduling System API
  version: 1.0.0
  description: Comprehensive API documentation for the Smart Exam Scheduling System.
servers:
  - url: /api
    description: Main API server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [TECH_ADMIN, SCHEDULING_ADMIN, SUPERVISOR, STUDENT]
    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          type: string
          enum: [TECH_ADMIN, SCHEDULING_ADMIN, SUPERVISOR, STUDENT]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        programId:
          type: string
          format: uuid
    CourseCreate:
      type: object
      required: [code, title]
      properties:
        code:
          type: string
        title:
          type: string
        programId:
          type: string
          format: uuid
    CourseUpdate:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        programId:
          type: string
          format: uuid
    Program:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
    ProgramCreate:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
    ProgramUpdate:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
    Semester:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isActive:
          type: boolean
    SemesterCreate:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isActive:
          type: boolean
    SemesterUpdate:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isActive:
          type: boolean
    CourseOffering:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        section:
          type: string
          nullable: true
        expectedStudents:
          type: integer
        capacity:
          type: integer
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, CANCELLED]
        createdBy:
          type: string
          nullable: true
    CourseOfferingCreate:
      type: object
      required: [courseId, semesterId, expectedStudents]
      properties:
        courseId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        section:
          type: string
        expectedStudents:
          type: integer
        capacity:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE, CANCELLED]
    CourseOfferingUpdate:
      type: object
      properties:
        courseId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        section:
          type: string
        expectedStudents:
          type: integer
        capacity:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE, CANCELLED]
    Center:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
          nullable: true
    CenterCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        location:
          type: string
    CenterUpdate:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
    RoomCreate:
      type: object
      required: [centerId, name, capacity]
      properties:
        centerId:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
    RoomUpdate:
      type: object
      properties:
        centerId:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
    TimeSlot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    TimeSlotCreate:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    TimeSlotUpdate:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        courseOfferingId:
          type: string
          format: uuid
    EnrollmentCreate:
      type: object
      required: [studentId, courseOfferingId]
      properties:
        studentId:
          type: string
          format: uuid
        courseOfferingId:
          type: string
          format: uuid
    EnrollmentBulkImport:
      type: object
      required: [enrollments]
      properties:
        enrollments:
          type: array
          items:
            type: object
            required: [studentId, courseOfferingId]
            properties:
              studentId:
                type: string
                format: uuid
              courseOfferingId:
                type: string
                format: uuid
    Exam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseOfferingId:
          type: string
          format: uuid
        status:
          type: string
        duration:
          type: integer
    Student:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        programId:
          type: string
          format: uuid
    StudentCreate:
      type: object
      required: [name, email, programId]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        programId:
          type: string
          format: uuid
    StudentUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        programId:
          type: string
          format: uuid
    Supervisor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    SupervisorCreate:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    SupervisorUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    ConflictDetectionRequest:
      type: object
      required: [scheduleId, type]
      properties:
        scheduleId:
          type: string
          format: uuid
        type:
          type: string
          enum: [STUDENT_OVERLAP, SUPERVISOR_DOUBLE_BOOKED, ROOM_OVERCAPACITY, RESOURCE_UNAVAILABLE, TIME_CONSTRAINT_VIOLATION]
        description:
          type: string
        resolved:
          type: boolean
    SchedulePrepareRequest:
      type: object
      properties:
        semesterId:
          type: string
          format: uuid
        constraints:
          type: object
    ScheduleValidateInputRequest:
      type: object
      properties:
        scheduleId:
          type: string
          format: uuid
    ScheduleGenerateRequest:
      type: object
      required: [semesterId]
      properties:
        semesterId:
          type: string
          format: uuid
    ScheduleAnalysis:
      type: object
      properties:
        totalConflicts:
          type: integer
        roomUtilization:
          type: number
        supervisorLoadStdDev:
          type: number
      additionalProperties: true
tags:
  - name: AI
    description: Schedule evaluation and AI utilities.
  - name: Auth
    description: Authentication and user account management.
  - name: Conflicts
    description: Conflict detection endpoints.
  - name: Courses
    description: Course management.
  - name: Programs
    description: Program management.
  - name: Semesters
    description: Semester lifecycle.
  - name: Course Offerings
    description: Semester-specific course offerings.
  - name: Enrollments
    description: Student enrollments and import operations.
  - name: Exams
    description: Exam management.
  - name: Centers
    description: Centers and room inventories.
  - name: Rooms
    description: Room availability and administration.
  - name: Scheduling
    description: Schedule generation and analysis.
  - name: Students
    description: Student management.
  - name: Supervisors
    description: Supervisor management.
  - name: Time Slots
    description: Timeslot availability and management.
security:
  - bearerAuth: []
paths:
  /auth:
    get:
      tags: [Auth]
      summary: Get all users
      responses:
        '200':
          description: Users fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Auth]
      summary: Delete current user
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              name: John Doe
              email: john.doe@example.com
              password: securepassword123
              role: STUDENT
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: john.doe@example.com
              password: securepassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /programs:
    get:
      tags: [Programs]
      summary: Get all programs
      responses:
        '200':
          description: Programs list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Programs]
      summary: Create a program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
            example:
              name: Computer Science
              code: CS
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /programs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Programs]
      summary: Get program by ID
      responses:
        '200':
          description: Program fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Program not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Programs]
      summary: Update a program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramUpdate'
            example:
              name: Computer Science Updated
              code: CS
      responses:
        '200':
          description: Program updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Program not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Programs]
      summary: Delete a program
      responses:
        '200':
          description: Program deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Program not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /semesters:
    get:
      tags: [Semesters]
      summary: Get all semesters
      responses:
        '200':
          description: Semesters list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Semesters]
      summary: Create a semester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterCreate'
            example:
              name: Fall 2024
              startDate: '2024-09-01T00:00:00Z'
              endDate: '2024-12-31T23:59:59Z'
              isActive: false
      responses:
        '201':
          description: Semester created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /semesters/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Semesters]
      summary: Get semester by ID
      responses:
        '200':
          description: Semester fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Semester not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Semesters]
      summary: Update a semester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterUpdate'
            example:
              name: Fall 2024 Updated
              startDate: '2024-09-01T00:00:00Z'
              endDate: '2024-12-31T23:59:59Z'
              isActive: true
      responses:
        '200':
          description: Semester updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Semester not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Semesters]
      summary: Delete a semester
      responses:
        '200':
          description: Semester deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Semester not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /course-offerings:
    get:
      tags: [Course Offerings]
      summary: Get all course offerings
      responses:
        '200':
          description: Course offerings list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Course Offerings]
      summary: Create a course offering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseOfferingCreate'
            example:
              courseId: '123e4567-e89b-12d3-a456-426614174000'
              semesterId: '123e4567-e89b-12d3-a456-426614174001'
              section: 'A'
              expectedStudents: 30
              capacity: 35
              status: ACTIVE
      responses:
        '201':
          description: Course offering created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /course-offerings/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Course Offerings]
      summary: Get course offering by ID
      responses:
        '200':
          description: Course offering fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Course offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Course Offerings]
      summary: Update a course offering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseOfferingUpdate'
            example:
              courseId: '123e4567-e89b-12d3-a456-426614174000'
              semesterId: '123e4567-e89b-12d3-a456-426614174001'
              section: 'B'
              expectedStudents: 25
              capacity: 30
              status: ACTIVE
      responses:
        '200':
          description: Course offering updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Course Offerings]
      summary: Delete a course offering
      responses:
        '200':
          description: Course offering deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Course offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /centers:
    get:
      tags: [Centers]
      summary: Get all centers
      responses:
        '200':
          description: Centers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Centers]
      summary: Create a center
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CenterCreate'
            example:
              name: Main Campus
              location: Downtown
      responses:
        '201':
          description: Center created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /centers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
